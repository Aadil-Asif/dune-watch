name: Odyssey IMAX 70mm watch

on:
  schedule:
    # This is the FALLBACK watcher; daemon.py on the always-on box is primary.
    # Half-hourly is deliberate: it only has to cover the case where that box
    # or its internet is down, and it runs from GitHub's datacenter IPs, which
    # are likelier to get rate-limited. Its alerts are tagged [backup] and sent
    # at lower priority so they don't buzz like the real thing.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reseed:
        description: "Rebuild state from scratch without alerting"
        type: boolean
        default: false
      dry_run:
        description: "Print notifications instead of sending"
        type: boolean
        default: false

# Never let two sweeps race on state.json.
concurrency:
  group: odyssey-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep Fandango
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '21' }}
          WATCHER_LABEL: backup
          TEST_MODE: ${{ secrets.TEST_MODE || '' }}
        run: |
          python watch.py \
            ${{ inputs.reseed && '--reseed' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed while we were sweeping.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Could not push state after 3 attempts" >&2
          exit 1
